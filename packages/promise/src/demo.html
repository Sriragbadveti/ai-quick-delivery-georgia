<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Promise Console</title>
<style>
  :root { --ink:#14213d; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --red:#b3152b; --isani:#1b6ca8; --saburtalo:#b3152b; --vake:#2e7d32; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:14px 22px; background:var(--ink); color:#fff; display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header span { font-size:13px; color:#c9d1e3; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:16px; padding:16px 22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  svg { width:100%; height:auto; display:block; }
  .cell { stroke:#fff; stroke-width:0.6; cursor:pointer; }
  .cell:hover { stroke:var(--ink); stroke-width:1.5; }
  .cell.sel { stroke:#000; stroke-width:2.2; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  select, input[type=range] { width:100%; }
  select { padding:6px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .big { font-size:44px; font-weight:700; line-height:1; margin:6px 0 2px; }
  .ten { color:#0e7a4b; } .not { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:10px; }
  td { padding:6px 0; border-bottom:1px solid var(--line); } td:last-child { text-align:right; font-variant-numeric: tabular-nums; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  pre { background:#0f172a; color:#e2e8f0; font-size:11.5px; padding:10px; border-radius:6px; overflow:auto; max-height:170px; margin:10px 0 0; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header><h1>Delivery Promise Console</h1><span>Tbilisi dark stores · service zones on the OpenStreetMap road network · promise engine (P90 ≤ 10 min)</span></header>
<main>
  <section class="card">
    <svg id="map" viewBox="0 0 900 560" aria-label="Map of service zones and hexagons"></svg>
    <div class="legend">
      <span><i class="sw" style="background:var(--isani)"></i>Isani</span>
      <span><i class="sw" style="background:var(--saburtalo)"></i>Saburtalo</span>
      <span><i class="sw" style="background:var(--vake)"></i>Vake</span>
      <span>Solid outline: 7-min zone in the selected band · click a hexagon to request a promise</span>
    </div>
  </section>
  <aside class="card">
    <label for="band">Time band</label>
    <select id="band">
      <option value="morning">Morning (08–12)</option><option value="midday" selected>Midday (12–17)</option>
      <option value="evening_peak">Evening peak (17–21)</option><option value="night">Night (21–24)</option><option value="weekend">Weekend</option>
    </select>
    <label for="wait">Expected wait for a courier: <b id="waitv">0.0</b> min</label>
    <input id="wait" type="range" min="0" max="10" step="0.5" value="0">
    <label>Selected address</label>
    <div id="sel" class="muted">Click a hexagon on the map.</div>
    <div id="out"></div>
  </aside>
</main>
<script>
const COL = { isani: "#1b6ca8", saburtalo: "#b3152b", vake: "#2e7d32" };
const svg = document.getElementById("map");
let data, selected = null, proj;
const ns = "http://www.w3.org/2000/svg";
const el = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

function makeProj(points) {
  const lats = points.map(p => p[1]), lngs = points.map(p => p[0]);
  const minX = Math.min(...lngs), maxX = Math.max(...lngs), minY = Math.min(...lats), maxY = Math.max(...lats);
  const k = Math.cos((minY + maxY) / 2 * Math.PI / 180), W = 900, H = 560, pad = 20;
  const s = Math.min((W - 2 * pad) / ((maxX - minX) * k), (H - 2 * pad) / (maxY - minY));
  return ([x, y]) => [pad + (x - minX) * k * s, H - pad - (y - minY) * s];
}
function path(ring) { return ring.map((p, i) => (i ? "L" : "M") + proj(p).map(v => v.toFixed(1)).join(",")).join("") + "Z"; }

function draw() {
  svg.innerHTML = "";
  const band = document.getElementById("band").value;
  const maxPop = Math.max(...data.cells.map(c => c.population));
  for (const c of data.cells) {
    const p = el("path", { d: path(c.boundary), class: "cell" + (selected && selected.cell === c.cell ? " sel" : ""), "data-cell": c.cell, fill: COL[c.store], "fill-opacity": (0.15 + 0.6 * c.population / maxPop).toFixed(2) });
    p.addEventListener("click", () => { selected = c; draw(); ask(); });
    svg.appendChild(p);
  }
  for (const f of data.zones.features.filter(f => f.properties.band === band)) {
    const polys = f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [f.geometry.coordinates];
    for (const poly of polys) svg.appendChild(el("path", { d: path(poly[0]), fill: "none", stroke: COL[f.properties.store], "stroke-width": 2.4 }));
  }
  for (const s of data.stores) {
    const [x, y] = proj([s.lng, s.lat]);
    svg.appendChild(el("circle", { cx: x, cy: y, r: 7, fill: COL[s.id], stroke: "#fff", "stroke-width": 2 }));
    const t = el("text", { x: x + 10, y: y - 8, "font-size": 15, "font-weight": 600, fill: COL[s.id], stroke: "#fff", "stroke-width": 3, "paint-order": "stroke" });
    t.textContent = s.name; svg.appendChild(t);
  }
}

async function ask() {
  if (!selected) return;
  const body = { store: selected.store, cell: selected.cell, band: document.getElementById("band").value, expectedWaitMin: Number(document.getElementById("wait").value) };
  document.getElementById("sel").innerHTML = `Hexagon <b>${selected.cell}</b><br>served by <b>${selected.store}</b> · ~${selected.population.toLocaleString()} residents`;
  const r = await (await fetch("/promise", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
  document.getElementById("out").innerHTML = `
    <label>Promise shown to the customer</label>
    <div class="big ${r.tenMinute ? "ten" : "not"}">${r.promisedMinutes} min</div>
    <div class="muted">${r.tenMinute ? "10-minute promise offered" : (r.inZone ? "P90 above 10 min: honest longer promise" : "Outside the 7-min zone: honest longer promise")}</div>
    <table>
      <tr><td>Riding time from store</td><td>${r.travelMin.toFixed(2)} min</td></tr>
      <tr><td>Median total time (P50)</td><td>${r.p50.toFixed(2)} min</td></tr>
      <tr><td>90th percentile (P90)</td><td>${r.p90.toFixed(2)} min</td></tr>
      <tr><td>Inside zone for this band</td><td>${r.inZone ? "yes" : "no"}</td></tr>
    </table>
    <pre>POST /promise
${JSON.stringify(body, null, 1)}

→ ${JSON.stringify(r, null, 1)}</pre>`;
}

document.getElementById("band").addEventListener("change", () => { draw(); ask(); });
document.getElementById("wait").addEventListener("input", e => { document.getElementById("waitv").textContent = Number(e.target.value).toFixed(1); ask(); });
fetch("/zones").then(r => r.json()).then(d => { data = d; proj = makeProj(d.cells.flatMap(c => c.boundary)); draw(); });
</script>
</body>
</html>
